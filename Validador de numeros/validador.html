<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Validador de Números</title>
  <style>
    :root {
      --bg: #f3f4f6;
      --card-bg: #ffffff;
      --text-main: #1f2937;
      --text-muted: #6b7280;
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --success-bg: #dcfce7;
      --success-text: #166534;
      --danger-bg: #fee2e2;
      --danger-text: #991b1b;
      --neutral-bg: #e0e7ff;
      --neutral-text: #3730a3;
      --border: #e5e7eb;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    }

    body {
      background: linear-gradient(135deg, #eef2ff 0%, #f3f4f6 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      color: var(--text-main);
    }

    .container {
      background: var(--card-bg);
      width: 100%;
      max-width: 580px;
      border-radius: 18px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.08), 0 8px 10px -6px rgba(0, 0, 0, 0.05);
      overflow: hidden;
      border: 1px solid var(--border);
    }

    .header {
      background: linear-gradient(135deg, #1e40af, #3b82f6);
      color: white;
      padding: 24px;
      text-align: center;
    }

    .header h1 {
      font-size: 1.6rem;
      font-weight: 700;
      margin-bottom: 6px;
    }

    .header p {
      font-size: 0.95rem;
      opacity: 0.9;
    }

    .content {
      padding: 24px;
    }

    .form-group {
      margin-bottom: 20px;
    }

    label {
      display: block;
      font-weight: 600;
      font-size: 0.95rem;
      margin-bottom: 8px;
      color: #374151;
    }

    .input-wrapper {
      display: flex;
      gap: 10px;
    }

    input[type="number"] {
      flex: 1;
      padding: 12px 16px;
      font-size: 1.1rem;
      border: 2px solid var(--border);
      border-radius: 10px;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    input[type="number"]:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.15);
    }

    .btn {
      padding: 12px 20px;
      background-color: var(--primary);
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s, transform 0.1s;
      white-space: nowrap;
    }

    .btn:hover {
      background-color: var(--primary-hover);
    }

    .btn:active {
      transform: scale(0.98);
    }

    .quick-tests {
      margin-top: 10px;
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .quick-tests span {
      font-size: 0.82rem;
      color: var(--text-muted);
      font-weight: 500;
    }

    .chip-btn {
      background: #f1f5f9;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      padding: 4px 10px;
      font-size: 0.82rem;
      cursor: pointer;
      color: #334155;
      font-weight: 500;
      transition: all 0.15s;
    }

    .chip-btn:hover {
      background: #e2e8f0;
      border-color: #94a3b8;
    }

    /* Result Card */
    .result-box {
      margin-top: 20px;
      padding: 20px;
      border-radius: 14px;
      background: #f8fafc;
      border: 1px solid var(--border);
      display: none;
      animation: fadeIn 0.3s ease-in-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .result-title {
      font-size: 0.85rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
      margin-bottom: 12px;
    }

    .badges-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 16px;
    }

    .badge-card {
      padding: 14px;
      border-radius: 12px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .badge-label {
      font-size: 0.8rem;
      text-transform: uppercase;
      font-weight: 600;
      margin-bottom: 4px;
      opacity: 0.8;
    }

    .badge-value {
      font-size: 1.25rem;
      font-weight: 700;
    }

    /* Color states */
    .state-positive {
      background-color: var(--success-bg);
      color: var(--success-text);
      border: 1px solid #86efac;
    }

    .state-negative {
      background-color: var(--danger-bg);
      color: var(--danger-text);
      border: 1px solid #fca5a5;
    }

    .state-zero {
      background-color: #f1f5f9;
      color: #475569;
      border: 1px solid #cbd5e1;
    }

    .state-even {
      background-color: #e0e7ff;
      color: #3730a3;
      border: 1px solid #c7d2fe;
    }

    .state-odd {
      background-color: #fef3c7;
      color: #92400e;
      border: 1px solid #fde68a;
    }

    .summary-text {
      background: white;
      padding: 14px;
      border-radius: 10px;
      font-size: 0.98rem;
      line-height: 1.5;
      border-left: 4px solid var(--primary);
      color: #374151;
    }

    /* History section */
    .history-section {
      margin-top: 24px;
      border-top: 1px solid var(--border);
      padding-top: 16px;
    }

    .history-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }

    .history-header h3 {
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--text-muted);
    }

    .clear-history-btn {
      background: none;
      border: none;
      color: #ef4444;
      font-size: 0.8rem;
      cursor: pointer;
      text-decoration: underline;
    }

    .history-list {
      list-style: none;
      max-height: 140px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .history-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #f8fafc;
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 0.88rem;
      border: 1px solid #f1f5f9;
    }

    .history-number {
      font-weight: bold;
    }

    .history-tags {
      font-size: 0.8rem;
      display: flex;
      gap: 6px;
    }

    .mini-tag {
      padding: 2px 6px;
      border-radius: 4px;
      font-weight: 600;
    }

    .footer {
      background: #f9fafb;
      padding: 14px 24px;
      text-align: center;
      border-top: 1px solid var(--border);
      font-size: 0.8rem;
      color: var(--text-muted);
    }
  </style>
</head>
<body>

  <main class="container">
    <header class="header">
      <h1>Validador de Números</h1>
      <p>Determina si un número es par, impar, positivo, negativo o cero</p>
    </header>

    <div class="content">
      <form id="validatorForm" onsubmit="analizarNumero(event)">
        <div class="form-group">
          <label for="numeroInput">Ingresa un número cualquiera:</label>
          <div class="input-wrapper">
            <input 
              type="number" 
              id="numeroInput" 
              step="any" 
              placeholder="Ej: -8, 0, 15..." 
              required 
              autofocus
            >
            <button type="submit" class="btn">Validar</button>
          </div>

          <div class="quick-tests">
            <span>Pruebas rápidas:</span>
            <button type="button" class="chip-btn" onclick="probar(0)">0 (Cero)</button>
            <button type="button" class="chip-btn" onclick="probar(14)">14 (Par +)</button>
            <button type="button" class="chip-btn" onclick="probar(-7)">-7 (Impar -)</button>
            <button type="button" class="chip-btn" onclick="probar(-22)">-22 (Par -)</button>
            <button type="button" class="chip-btn" onclick="probar(9)">9 (Impar +)</button>
          </div>
        </div>
      </form>

      <!-- Resultados -->
      <section id="resultBox" class="result-box" aria-live="polite">
        <div class="result-title">Resultados del Análisis</div>
        
        <div class="badges-grid">
          <!-- Tarjeta Signo -->
          <div id="badgeSigno" class="badge-card">
            <span class="badge-label">Signo</span>
            <span id="valorSigno" class="badge-value">Positivo</span>
          </div>

          <!-- Tarjeta Paridad -->
          <div id="badgeParidad" class="badge-card">
            <span class="badge-label">Paridad</span>
            <span id="valorParidad" class="badge-value">Par</span>
          </div>
        </div>

        <p id="textoResumen" class="summary-text"></p>
      </section>

      <!-- Historial de pruebas -->
      <div class="history-section" id="historySection" style="display: none;">
        <div class="history-header">
          <h3>Historial de validaciones</h3>
          <button class="clear-history-btn" onclick="limpiarHistorial()">Limpiar</button>
        </div>
        <ul class="history-list" id="historyList"></ul>
      </div>
    </div>

    <footer class="footer">
      Proyecto: Validador de Números • Actividad de 90 min • Ejecutable 100% sin dependencias
    </footer>
  </main>

  <script>
    const historial = [];

    function probar(valor) {
      document.getElementById('numeroInput').value = valor;
      analizarNumero(new Event('submit'));
    }

    function analizarNumero(e) {
      if (e) e.preventDefault();
      
      const input = document.getElementById('numeroInput');
      const rawVal = input.value.trim();

      if (rawVal === '') return;

      const num = Number(rawVal);

      if (isNaN(num)) {
        alert('Por favor, ingresa un número válido.');
        return;
      }

      // 1. Identificación del Signo (Positivo, Negativo o Cero)
      let signo = '';
      let claseSigno = '';
      let descSigno = '';

      if (num > 0) {
        signo = 'Positivo (+)';
        claseSigno = 'state-positive';
        descSigno = 'positivo (mayor a 0)';
      } else if (num < 0) {
        signo = 'Negativo (-)';
        claseSigno = 'state-negative';
        descSigno = 'negativo (menor a 0)';
      } else {
        signo = 'Cero (0)';
        claseSigno = 'state-zero';
        descSigno = 'cero (neutro, sin signo)';
      }

      // 2. Identificación de Paridad (Par o Impar)
      let paridad = '';
      let claseParidad = '';
      let descParidad = '';

      // Verificamos si es entero o decimal
      if (Number.isInteger(num)) {
        // En matemáticas, 0 es par porque 0 % 2 == 0
        if (num % 2 === 0) {
          paridad = 'Par';
          claseParidad = 'state-even';
          descParidad = 'un número par (es divisible exactamente entre 2)';
        } else {
          paridad = 'Impar';
          claseParidad = 'state-odd';
          descParidad = 'un número impar (al dividirse entre 2 deja residuo)';
        }
      } else {
        // En caso de que el usuario ingrese un número decimal
        paridad = 'Decimal';
        claseParidad = 'state-zero';
        descParidad = 'un número decimal (la regla de paridad aplica formalmente a números enteros)';
      }

      // Actualizar interfaz
      const resultBox = document.getElementById('resultBox');
      const badgeSigno = document.getElementById('badgeSigno');
      const valorSigno = document.getElementById('valorSigno');
      const badgeParidad = document.getElementById('badgeParidad');
      const valorParidad = document.getElementById('valorParidad');
      const textoResumen = document.getElementById('textoResumen');

      badgeSigno.className = 'badge-card ' + claseSigno;
      valorSigno.textContent = signo;

      badgeParidad.className = 'badge-card ' + claseParidad;
      valorParidad.textContent = paridad;

      let mensajeFinal = '';
      if (num === 0) {
        mensajeFinal = `El número <strong>0</strong> es <strong>neutro</strong> (no es positivo ni negativo) y matemáticamente es considerado <strong>par</strong>.`;
      } else {
        mensajeFinal = `El número <strong>${num}</strong> es <strong>${descSigno}</strong> y además es <strong>${descParidad}</strong>.`;
      }
      textoResumen.innerHTML = mensajeFinal;

      resultBox.style.display = 'block';

      // Agregar al historial
      agregarHistorial(num, signo, paridad);
    }

    function agregarHistorial(num, signo, paridad) {
      historial.unshift({ num, signo, paridad });
      if (historial.length > 8) historial.pop();

      const historySection = document.getElementById('historySection');
      const historyList = document.getElementById('historyList');

      historySection.style.display = 'block';
      historyList.innerHTML = '';

      historial.forEach(item => {
        const li = document.createElement('li');
        li.className = 'history-item';
        li.innerHTML = `
          <span class="history-number">${item.num}</span>
          <span class="history-tags">
            <span class="mini-tag" style="background:#e2e8f0;">${item.signo}</span>
            <span class="mini-tag" style="background:#e0e7ff; color:#3730a3;">${item.paridad}</span>
          </span>
        `;
        historyList.appendChild(li);
      });
    }

    function limpiarHistorial() {
      historial.length = 0;
      document.getElementById('historyList').innerHTML = '';
      document.getElementById('historySection').style.display = 'none';
    }
  </script>
</body>
</html>
